[package]
name = "faa-registry-mirror"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Download, parse, and historically track FAA aircraft ownership in SQLite"
license = "MIT"
repository = "https://github.com/alexwoolford/faa-registry-mirror"

[[bin]]
name = "faa-registry-mirror"
path = "src/main.rs"

[lib]
name = "faa_registry_mirror"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
capturable-state = { git = "https://github.com/alexwoolford/capturable-state", tag = "v0.1.1" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
